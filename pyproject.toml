[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "casper"
version = "0.1.0"
description = "Casper, the friendly ghostwriter — local-first, deterministic ghostwriting toolkit"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "spacy>=3.8,<3.9",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "scikit-learn>=1.5,<2.0",
    "networkx>=3.2,<4.0",
    "pyyaml>=6.0,<7.0",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.2,<6.0",
    "pypdf>=4.2,<6.0",
    "python-docx>=1.1,<2.0",
    "striprtf>=0.0.26,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "hypothesis>=6.100",
    "pillow>=10.4",
    "types-PyYAML>=6.0",
    "types-beautifulsoup4>=4.12",
]

[project.scripts]
casper = "casper.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/casper"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["casper"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "spacy",
    "spacy.*",
    "en_core_web_sm",
    "sklearn",
    "sklearn.*",
    "networkx",
    "networkx.*",
    "pypdf",
    "pypdf.*",
    "docx",
    "docx.*",
    "striprtf",
    "striprtf.*",
    "lxml",
    "lxml.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "loopback: allow loopback socket connections (127.0.0.1 / ::1) for real-socket E2E tests",
]

[tool.coverage.run]
source = ["src/casper"]
branch = true
omit = ["*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
